name: Spolk checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Public placeholders so the browser login check can mock Supabase. Not a real project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Public pages only. Authenticated browser tests stay local: npm run test:e2e:local
      - run: npm run test:e2e
        working-directory: apps/web
