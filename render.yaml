# Free web service. Uploads use private Supabase Storage, not a paid disk.
services:
  - type: web
    name: spolk
    runtime: docker
    repo: https://github.com/Adam-7th-2/spolk
    branch: main
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'commit'
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRIVATE_UPLOAD_STORAGE
        value: supabase
      - key: PRIVATE_UPLOAD_BUCKET
        value: spolk-private-uploads
      - key: EMAIL_DELIVERY_ENABLED
        value: '0'
